name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # MUI v4 still declares a React 16/17 peer range while the app runs
      # React 18. `npm ci` takes this as config, not as a flag.
      - run: npm ci
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      - run: npx tsc --noEmit
