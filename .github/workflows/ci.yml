name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm ci` is not usable here: package-lock.json has drifted out of sync
      # with package.json. MUI v4 also still declares a React 16/17 peer range
      # while the app runs React 18, hence the legacy resolver.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit
